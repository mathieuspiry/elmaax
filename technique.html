<style>

body { font-family: 'Inter', 'Segoe UI', Arial, sans-serif; background: #F7FBFA; color: #0F3D3E; min-height: 100vh; display: flex; flex-direction: column; }

.grid-hub { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; padding: 32px; flex: 1; }
.hub-card { background: white; border-radius: 12px; border: 1px solid #d4e9e8; padding: 28px 20px; text-align: center; text-decoration: none; color: #0F3D3E; display: flex; flex-direction: column; align-items: center; gap: 12px; transition: all 0.15s; }
.hub-card:hover { border-color: #0FA3A0; box-shadow: 0 4px 16px rgba(15,163,160,0.15); transform: translateY(-2px); }
.hub-card .icon { font-size: 32px; }
.hub-card .label { font-size: 16px; font-weight: 700; color: #0F3D3E; }
.hub-card .count { font-size: 13px; color: #4b6b6b; background: #e8f5f5; padding: 3px 12px; border-radius: 20px; }
